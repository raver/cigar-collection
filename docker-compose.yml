services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cigar
      POSTGRES_USER: cigar
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_cigar_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cigar"]
      interval: 5s
      timeout: 5s
      retries: 5

  cigar-api:
    build: ./api
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://cigar:${DB_PASSWORD}@postgres:5432/cigar
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

  cigar-web:
    build: ./web
    restart: unless-stopped
    environment:
      - ORIGIN=https://cigar.bixinxin.com
      - API_TARGET=http://cigar-api:3001
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  postgres_cigar_data:
