services:
  cigar-api:
    build: ./api
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
    extra_hosts:
      - "host.docker.internal:host-gateway"

  cigar-web:
    build: ./web
    restart: unless-stopped
    environment:
      - ORIGIN=http://localhost

  cigar-nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - cigar-api
      - cigar-web
