name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

# 防止上次部署还没结束、新的 push 又触发，导致 VPS 上并发操作
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  # ── Job 1: 测试 + 构建检查 ──
  test:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      SESSION_SECRET: test-session-secret-for-ci
      DATABASE_URL: postgresql://test:test@localhost:5432/testdb
      ADMIN_ORIGIN: http://localhost:5173

      # 当前是可选（代码里仅 warning）
      R2_ACCOUNT_ID: dummy
      R2_ACCESS_KEY_ID: dummy
      R2_SECRET_ACCESS_KEY: dummy
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            api/pnpm-lock.yaml
            web/pnpm-lock.yaml

      - name: Install API deps
        working-directory: api
        run: pnpm install --frozen-lockfile

      - name: Test API
        working-directory: api
        run: pnpm test          # vitest run，数据库已 mock，无需真库

      - name: Build API
        working-directory: api
        run: pnpm build         # tsc 类型检查

      - name: Install Web deps
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Build Web
        working-directory: web
        run: pnpm build         # vite build

  # ── Job 2: 构建镜像并推送到 GHCR ──
  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # 推送 GHCR 所需
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/cigar-api:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository }}/cigar-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push Web
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/cigar-web:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository }}/cigar-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 3: SSH 到 VPS 部署 ──
  deploy:
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script: |
            set -e
            cd /srv/cigar
            git pull --ff-only
            docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GHCR_PULL_TOKEN }}
            docker compose pull
            docker compose up -d postgres
            docker compose run --rm --no-deps cigar-api pnpm db:migrate
            docker compose up -d
            docker image prune -f
